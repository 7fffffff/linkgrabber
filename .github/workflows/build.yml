name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: make lint

    - name: Build
      run: make build

    - name: Create package
      run: make package

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: linkgrabber-extension
        path: dist/linkgrabber.zip 